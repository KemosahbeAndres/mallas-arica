name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io

# Serializa los deploys. cancel-in-progress=false: nunca abortar un deploy
# a medias, podría dejar migraciones aplicadas sin la imagen correspondiente.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  # ==========================================================
  # 1. TESTS
  # ==========================================================
  test:
    name: Tests
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_DATABASE: sigma_test
          MARIADB_USER: sigma
          MARIADB_PASSWORD: secret
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, mbstring, bcmath, exif, pcntl, gd, zip, intl, redis
          coverage: none

      - name: Cachear dependencias de Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Instalar dependencias
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias de Node
        run: npm ci

      - name: Compilar assets (Vite)
        run: npm run build

      - name: Preparar entorno de test
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Verificar estilo (Pint)
        run: ./vendor/bin/pint --test

      - name: Ejecutar tests
        env:
          APP_ENV: testing
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: sigma_test
          DB_USERNAME: sigma
          DB_PASSWORD: secret
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          CACHE_STORE: redis
          SESSION_DRIVER: redis
        run: php artisan test

  # ==========================================================
  # 2. BUILD Y PUSH A GHCR
  # ==========================================================
  build:
    name: Build y push
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.short_sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Calcular tag e imagen
        id: meta
        run: |
          # GHCR exige minúsculas en el nombre del repositorio.
          echo "image=${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
          echo "short_sha=sha-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - uses: docker/setup-buildx-action@v3

      - name: Login en GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build y push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/prod/Dockerfile
          push: true
          # Tag inmutable por SHA + latest. El SHA permite rollback exacto.
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.short_sha }}
            ${{ steps.meta.outputs.image }}:latest
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  # ==========================================================
  # 3. DEPLOY AL VPS
  # ==========================================================
  deploy:
    name: Deploy a producción
    runs-on: ubuntu-latest
    needs: build
    environment: production

    steps:
      - name: Desplegar por SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script_stop: true
          envs: IMAGE_TAG
          script: |
            set -euo pipefail

            # Traer los archivos de infraestructura más recientes del repo
            # (docker-compose.yml, etc.) — corre en el VPS host, no en un
            # contenedor. El .env real vive solo en /opt/mallas-arica/.env
            # y nunca se toca ni se pisa desde el repo clonado.
            cd /opt/mallas-arica/repo
            git pull --ff-only
            cp deploy/docker-compose.yml /opt/mallas-arica/docker-compose.yml

            cd /opt/mallas-arica

            # Guardar el tag actual para poder revertir.
            PREV_TAG=$(grep '^IMAGE_TAG=' .env | cut -d= -f2)
            echo "Tag anterior: ${PREV_TAG} → nuevo: ${IMAGE_TAG}"

            rollback() {
              echo "::error::Deploy fallido. Revirtiendo a ${PREV_TAG}"
              sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=${PREV_TAG}|" .env
              docker compose up -d --wait || true
              exit 1
            }
            trap rollback ERR

            # Apuntar al nuevo tag y traer la imagen.
            sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=${IMAGE_TAG}|" .env
            docker compose pull

            # --wait bloquea hasta que el healthcheck /up pase.
            docker compose up -d --wait --wait-timeout 120

            # Migraciones: paso explícito y visible, no en el entrypoint.
            docker compose exec -T app php artisan migrate --force

            trap - ERR

            # Liberar capas huérfanas: el disco son 80 GB compartidos.
            docker image prune -f --filter "until=168h"

            echo "Deploy OK: ${IMAGE_TAG}"
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
