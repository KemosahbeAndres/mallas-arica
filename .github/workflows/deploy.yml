name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Permite re-desplegar a mano (p. ej. tras un parche de seguridad de PHP).
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

# Serializa los deploys. cancel-in-progress=false: nunca abortar un deploy
# a medias, podría dejar migraciones aplicadas sin la imagen correspondiente.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  # ==========================================================
  # 1. TESTS
  # ==========================================================
  test:
    name: Tests
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_DATABASE: appmallas_test
          MARIADB_USER: appmallas
          MARIADB_PASSWORD: secret
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, mbstring, bcmath, exif, pcntl, gd, zip, intl, redis
          coverage: none

      - name: Cachear dependencias de Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Instalar dependencias
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias de Node
        run: npm ci

      - name: Compilar assets (Vite)
        run: npm run build

      - name: Preparar entorno de test
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Verificar estilo (Pint)
        run: ./vendor/bin/pint --test

      - name: Ejecutar tests
        env:
          APP_ENV: testing
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: appmallas_test
          DB_USERNAME: appmallas
          DB_PASSWORD: secret
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          CACHE_STORE: redis
          SESSION_DRIVER: redis
        run: php artisan test

  # ==========================================================
  # 1b. VALIDAR LA IMAGEN DE PRODUCCIÓN (corre también en PRs)
  # ==========================================================
  # Construye el mismo Dockerfile que se despliega, sin hacer push, y lo
  # arranca contra MariaDB/Redis reales. Así un Dockerfile roto, una
  # extensión PHP faltante, un nginx.conf inválido o un entrypoint que no
  # levanta se detectan en el PR y no recién al mergear a main.
  validar-imagen:
    name: Validar imagen Docker
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_DATABASE: appmallas_ci
          MARIADB_USER: appmallas
          MARIADB_PASSWORD: secret
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      IMAGE: mallas-arica:ci

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build (sin push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/prod/Dockerfile
          load: true
          push: false
          tags: ${{ env.IMAGE }}
          build-args: |
            APP_VERSION=ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          pull: true

      - name: Versión de PHP parchada
        run: |
          # Mismo umbral que la guarda del Dockerfile (CVE-2026-109618/109619).
          # Si sale una nueva release de seguridad, subir ambos valores.
          docker run --rm --entrypoint php "$IMAGE" -r '
            echo "PHP " . PHP_VERSION . PHP_EOL;
            exit(version_compare(PHP_VERSION, "8.4.27", ">=") ? 0 : 1);'

      - name: Extensiones PHP requeridas
        run: |
          docker run --rm --entrypoint php "$IMAGE" -r '
            $faltan = array_filter(
              ["pdo_mysql","mbstring","bcmath","exif","pcntl","gd","zip","intl","redis","Zend OPcache"],
              fn ($e) => ! extension_loaded($e)
            );
            if ($faltan) { fwrite(STDERR, "Faltan extensiones: ".implode(", ", $faltan).PHP_EOL); exit(1); }
            echo "Extensiones OK".PHP_EOL;'

      - name: Configuración de nginx y php-fpm válida
        run: |
          docker run --rm --entrypoint sh "$IMAGE" -c 'nginx -t && php-fpm -t'

      - name: Arrancar el contenedor (entrypoint + healthcheck)
        run: |
          # Red del host: el contenedor llega a los services del runner por
          # 127.0.0.1. APP_KEY es descartable, solo vive en este job.
          docker run -d --name app --network host \
            -e APP_ENV=production -e APP_DEBUG=false \
            -e APP_KEY="base64:$(head -c 32 /dev/urandom | base64)" \
            -e APP_URL=http://localhost \
            -e DB_CONNECTION=mysql -e DB_HOST=127.0.0.1 -e DB_PORT=3306 \
            -e DB_DATABASE=appmallas_ci -e DB_USERNAME=appmallas -e DB_PASSWORD=secret \
            -e REDIS_HOST=127.0.0.1 -e REDIS_PORT=6379 \
            -e CACHE_STORE=redis -e SESSION_DRIVER=redis -e QUEUE_CONNECTION=redis \
            "$IMAGE"

          for i in $(seq 1 30); do
            if [ "$(docker inspect -f '{{.State.Running}}' app)" != "true" ]; then
              echo "::error::El contenedor se detuvo antes de quedar sano."
              exit 1
            fi
            if curl -fsS http://127.0.0.1/up >/dev/null 2>&1; then
              echo "Healthcheck /up OK tras ~$((i * 3))s"
              exit 0
            fi
            sleep 3
          done
          echo "::error::/up no respondió en 90s."
          exit 1

      - name: Migraciones contra MariaDB
        run: docker exec app php artisan migrate --force

      - name: Logs del contenedor (si algo falló)
        if: failure()
        run: docker logs app || true

  # ==========================================================
  # 2. BUILD Y PUSH A GHCR
  # ==========================================================
  build:
    name: Build y push
    runs-on: ubuntu-latest
    needs: [test, validar-imagen]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.short_sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Calcular tag e imagen
        id: meta
        run: |
          # GHCR exige minúsculas en el nombre del repositorio.
          echo "image=${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
          echo "short_sha=sha-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - uses: docker/setup-buildx-action@v3

      - name: Login en GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build y push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/prod/Dockerfile
          push: true
          # Tag inmutable por SHA + latest. El SHA permite rollback exacto.
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.short_sha }}
            ${{ steps.meta.outputs.image }}:latest
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          # Re-resuelve la imagen base en cada build (parches de seguridad).
          pull: true

  # ==========================================================
  # 3. DEPLOY AL VPS
  # ==========================================================
  deploy:
    name: Deploy a producción
    runs-on: ubuntu-latest
    needs: build
    environment: production

    steps:
      - name: Desplegar por SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script_stop: true
          envs: IMAGE_TAG
          script: |
            set -euo pipefail

            # Traer los archivos de infraestructura más recientes del repo
            # (docker-compose.yml, etc.) — corre en el VPS host, no en un
            # contenedor. El .env real vive solo en /opt/mallas-arica/.env
            # y nunca se toca ni se pisa desde el repo clonado.
            cd /opt/mallas-arica/repo
            git pull --ff-only
            cp deploy/docker-compose.yml /opt/mallas-arica/docker-compose.yml

            cd /opt/mallas-arica

            # --- Guard: dependencias externas de infraestructura ---
            # Fallar aquí, con mensaje claro, en vez de disparar un rollback
            # que no arregla nada.
            for net in proxy backend-shared; do
              docker network inspect "$net" >/dev/null 2>&1 || {
                echo "::error::La red '$net' no existe. Levanta /opt/infra antes de desplegar."
                exit 1
              }
            done

            for svc in shared-mariadb shared-redis; do
              [ "$(docker inspect -f '{{.State.Running}}' "$svc" 2>/dev/null)" = "true" ] || {
                echo "::error::El contenedor '$svc' no está corriendo. Revisa /opt/infra/data."
                exit 1
              }
            done

            # Guardar el tag actual para poder revertir.
            PREV_TAG=$(grep '^IMAGE_TAG=' .env | cut -d= -f2)
            echo "Tag anterior: ${PREV_TAG} → nuevo: ${IMAGE_TAG}"

            rollback() {
              echo "::error::Deploy fallido. Revirtiendo a ${PREV_TAG}"
              sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=${PREV_TAG}|" .env
              docker compose up -d --wait || true
              exit 1
            }
            trap rollback ERR

            # Apuntar al nuevo tag y traer la imagen.
            sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=${IMAGE_TAG}|" .env
            docker compose pull

            # --wait bloquea hasta que el healthcheck /up pase.
            docker compose up -d --wait --wait-timeout 120

            # Migraciones: paso explícito y visible, no en el entrypoint.
            docker compose exec -T app php artisan migrate --force

            trap - ERR

            # Liberar capas huérfanas: el disco son 80 GB compartidos.
            docker image prune -f --filter "until=168h"

            echo "Deploy OK: ${IMAGE_TAG}"
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
